name: Build and Push

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: xrumdik/k8s-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tag
        run: |
          cd gitops/apps/social-eng-app
          kustomize edit set image social-eng-app=ghcr.io/${{ github.repository }}:${{ github.sha }}
          cd ../../
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apps/social-eng-app/kustomization.yaml
          git commit -m "Update social-eng-app image to ${{ github.sha }}" || echo "No changes"
          git pull --rebase origin main
          git push

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="{{ "/" | relURL }}">🛡️ {{ .Site.Title }}</a>
      <nav>
        {{ range .Site.Menus.main }}
          <a href="{{ .URL | relURL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <p>Учебные материалы по кибербезопасности · Тестовый стенд Kubernetes</p>
    <p class="pod-info">Обслужено подом: <code>__POD_NAME__</code> (нода: <code>__NODE_NAME__</code>)</p>
  </footer>
</body>
</html>
